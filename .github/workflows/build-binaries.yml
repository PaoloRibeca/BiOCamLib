name: Build macOS binaries

# Build on GitHub's macOS runners the BiOCamLib binaries that cannot be produced
# on the Linux development machine, and upload them as artifacts.  On the dev
# machine, 'bash BUILD mac-end' downloads them and packages each directory the
# way the BUILD script's 'package' target would:
#
#   PACKAGE_PLATFORM=Darwin-arm64 PACKAGE_BINDIR=./BiOCamLib-Darwin-arm64 \
#     bash BUILD package
#
# (no version argument: one given would replace releases/CURRENT, whereas these
# archives share the version the tagged commit already carries, and mac-begin
# refuses to tag a commit whose CURRENT differs from the working tree's).
#
# BiOCamLib is pure OCaml, so the macOS binaries are built exactly like the
# Linux ones (no C/C++ path, no dune patching) — the only system dependency is
# GMP, for zarith.  BUILD's 'package', 'mac-begin' and 'mac-end' targets all
# forward to tools/release; what ships (LICENSE, README.pdf, ...) is listed in
# releases/MANIFEST, and versioning and archive naming belong to tools/release.

on:
  # Manual runs and version tags only — never on every push, so the metered
  # macOS runner minutes (10x multiplier on private repos) are spent sparingly.
  workflow_dispatch:
  push:
    tags:
      - "v*"

# One run per ref; a newer push of the same ref cancels an in-flight build.
concurrency:
  group: build-binaries-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # arm64 builds on macOS 14 (Apple Silicon).  Intel uses macos-15-intel
      # because it is a STANDARD 4-core runner, eligible for the free plan's
      # included minutes — unlike macos-14-large, a paid 12-core runner.
      matrix:
        include:
          - runner: macos-14        # macOS 14, Apple Silicon (arm64)
            arch: arm64
          - runner: macos-15-intel  # macOS 15, Intel (x86_64)
            arch: x86_64
    steps:
      - name: Check out (full history)
        uses: actions/checkout@v5
        with:
          # Full history: BUILD derives the version string from the commit-file
          # count, so a shallow clone would stamp the binaries with a bogus version.
          fetch-depth: 0

      - name: Install system dependencies
        # GMP for zarith; the rest of BiOCamLib is pure OCaml.
        run: brew install gmp

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "4.14"

      - name: Install OCaml dependencies
        run: opam install --yes dune menhir zarith

      - name: Build binaries
        # Plain 'release', not 'release-static': macOS has no static libSystem,
        # so -ccopt -static won't link.
        run: opam exec -- bash BUILD release

      - name: Stage binaries
        # Which binaries ship is releases/MANIFEST's business, and naming them
        # here as well is how NJ came to be built by this workflow and then left
        # out of its artifact -- the packaging step on the other side reads the
        # manifest, so the two lists have to agree and only one of them should
        # exist.  Every '.build/<name>' entry is a compiled binary.
        run: |
          mkdir -p dist
          awk '$1 ~ /^\.build\// { print $1 }' releases/MANIFEST \
            | while read -r b; do cp "$b" dist/; done
          ls -l dist/

      - name: Smoke-check binaries (non-blocking)
        # Confirm each binary at least loads (dyld resolves its libraries).
        # Informational only — never fails the job.
        run: |
          for b in dist/*; do
            echo "=== otool -L $b ==="; otool -L "$b" || true
            echo "=== $b --help ==="; "./$b" --help 2>&1 | head -3 || true
          done

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: BiOCamLib-Darwin-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
